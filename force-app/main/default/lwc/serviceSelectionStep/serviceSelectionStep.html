<template>
    <div class="slds-p-around_medium">
        <div class="slds-m-bottom_medium slds-text-align_center">
            <h2 class="slds-text-heading_medium">Select a Service Type</h2>
            <p class="slds-text-body_regular slds-text-color_weak slds-m-top_xx-small">
                Choose the service required for this appointment. Slot durations will adjust automatically.
            </p>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-is-relative slds-p-around_large">
                <lightning-spinner alternative-text="Loading services" size="medium"></lightning-spinner>
            </div>
        </template>

        <template lwc:if={hasServices}>
            <div class="slds-grid slds-gutters slds-wrap slds-grid_align-center">
                <template for:each={services} for:item="svc">
                    <div key={svc.Id} class="slds-col slds-size_1-of-1 slds-medium-size_4-of-12 slds-m-bottom_medium">
                        <div class="slds-box service-card slds-p-around_medium">
                            <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_small">
                                <span class="slds-badge slds-badge_inverse duration-badge">
                                    ⏱️ {svc.Duration_Minutes__c} mins
                                </span>
                            </div>

                            <h3 class="slds-text-heading_small slds-m-bottom_x-small font-semibold">
                                {svc.Name}
                            </h3>

                            <p class="slds-text-body_small slds-text-color_weak description-text slds-m-bottom_medium">
                                {svc.Description__c}
                            </p>

                            <lightning-button
                                label="Select Service"
                                variant="brand"
                                icon-name="utility:check"
                                class="slds-size_full"
                                onclick={handleSelectService}
                                data-id={svc.Id}>
                            </lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <template lwc:if={noServices}>
            <div class="slds-p-around_large slds-text-align_center slds-text-color_weak">
                No active service types were found in the system.
            </div>
        </template>
    </div>
</template>
