<template>
    <div class="slds-p-around_medium">
        <div class="slds-grid slds-gutters slds-wrap">
            <!-- Left Column: Branch Locations Ranked by Distance -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                <lightning-card title="1. Select Branch Location" icon-name="standard:address">
                    <div class="slds-p-horizontal_small">
                        <template lwc:if={isLoadingLocations}>
                            <div class="slds-is-relative slds-p-around_medium">
                                <lightning-spinner alternative-text="Finding locations" size="small"></lightning-spinner>
                            </div>
                        </template>

                        <template lwc:if={hasLocations}>
                            <template for:each={locations} for:item="loc">
                                <div
                                    key={loc.locationId}
                                    class={loc.cardClass}
                                    onclick={handleSelectLocation}
                                    data-id={loc.locationId}>
                                    <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
                                        <div class="font-semibold slds-text-heading_small">
                                            {loc.locationName}
                                        </div>
                                        <template lwc:if={loc.distanceKm}>
                                            <span class="slds-badge slds-theme_success">
                                                📍 {loc.distanceKm} km
                                            </span>
                                        </template>
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_weak slds-m-top_xx-small">
                                        {loc.street}, {loc.city} &bull; {loc.postalCode}
                                    </div>
                                    <div class="slds-text-body_small slds-text-color_default slds-m-top_xx-small">
                                        Staff: {loc.staffSummary}
                                    </div>
                                </div>
                            </template>
                        </template>

                        <template lwc:if={noLocationsFound}>
                            <div class="slds-p-around_medium slds-text-align_center slds-text-color_weak">
                                No branch locations currently have qualified staff for this service.
                            </div>
                        </template>
                    </div>
                </lightning-card>
            </div>

            <!-- Right Column: Date & Available Slots -->
            <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                <lightning-card title="2. Choose Date & Time Slot" icon-name="standard:event">
                    <div class="slds-p-horizontal_medium">
                        <template lwc:if={selectedLocation}>
                            <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                                    <lightning-input
                                        type="date"
                                        label="Appointment Date"
                                        value={selectedDate}
                                        min={minDate}
                                        onchange={handleDateChange}>
                                    </lightning-input>
                                </div>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_6-of-12">
                                    <lightning-button
                                        label="Refresh Availability"
                                        icon-name="utility:refresh"
                                        onclick={loadSlots}>
                                    </lightning-button>
                                </div>
                            </div>

                            <template lwc:if={isLoadingSlots}>
                                <div class="slds-is-relative slds-p-around_large">
                                    <lightning-spinner alternative-text="Calculating available slots" size="small"></lightning-spinner>
                                </div>
                            </template>

                            <template lwc:if={hasSlots}>
                                <div class="slds-m-bottom_medium">
                                    <h4 class="slds-text-title_bold slds-m-bottom_small">Available Time Slots</h4>
                                    <div class="slots-container">
                                        <template for:each={slots} for:item="slot">
                                            <button
                                                key={slot.slotKey}
                                                class={slot.btnClass}
                                                onclick={handleSelectSlot}
                                                data-key={slot.slotKey}>
                                                <div class="slot-time">{slot.timeDisplay}</div>
                                                <div class="slot-staff">👤 {slot.staffName}</div>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template lwc:if={noSlotsAvailable}>
                                <div class="slds-box slds-theme_shade slds-m-bottom_medium slds-text-align_center">
                                    <p class="slds-text-color_weak">
                                        No free slots available on this date at {selectedLocation.locationName}. Please select another date.
                                    </p>
                                </div>
                            </template>

                            <!-- Notes -->
                            <div class="slds-m-top_medium">
                                <lightning-textarea
                                    label="Operator Notes / Special Customer Instructions"
                                    placeholder="Enter any customer notes or access instructions..."
                                    value={notes}
                                    onchange={handleNotesChange}>
                                </lightning-textarea>
                            </div>

                            <div class="slds-m-top_large slds-text-align_right">
                                <lightning-button
                                    variant="brand"
                                    label="Proceed to Review"
                                    icon-name="utility:forward"
                                    disabled={isProceedDisabled}
                                    onclick={handleProceed}>
                                </lightning-button>
                            </div>
                        </template>

                        <template lwc:else>
                            <div class="slds-p-around_large slds-text-align_center slds-text-color_weak">
                                👈 Please select a branch location on the left to view available dates and time slots.
                            </div>
                        </template>
                    </div>
                </lightning-card>
            </div>
        </div>
    </div>
</template>
